name: Deploy Pathogen Atlas Explorer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-explorer.yml'
      - 'sites/pathogen-atlas-explorer/dist/index.html'
      - 'sites/pathogen-atlas-explorer/scripts/build_feature_catalog.py'
      - 'configs/features.yaml'
      - 'configs/feature_profiles.yaml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download public Explorer data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/explorer-data _site
          gh release download explorer-site-data \
            --repo "$GITHUB_REPOSITORY" \
            --pattern explorer-site-data.tar.gz \
            --dir /tmp/explorer-data
          tar -xzf /tmp/explorer-data/explorer-site-data.tar.gz -C _site

      - name: Build current three-level feature catalogue
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export feature hierarchy for the Explorer
        run: |
          python -m pip install PyYAML==6.0.2
          python sites/pathogen-atlas-explorer/scripts/build_feature_catalog.py --output _site/feature-catalog.json

      - name: Add Explorer application and brand assets
        run: |
          cp sites/pathogen-atlas-explorer/dist/index.html _site/index.html
          mkdir -p _site/assets
          cp sites/pathogen-atlas-explorer/dist/assets/pathogen-atlas-logo.png _site/assets/pathogen-atlas-logo.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
