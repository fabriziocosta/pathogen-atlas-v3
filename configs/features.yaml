schema_version: 2
id: pathogen_atlas_features
version: multi-domain-features-v3.2
answer_type: noul
review_note: Feature questions share a common human-disease evidence frame. Per-feature inclusion and exclusion
  examples are schematic guidance, not claims about specific published studies. Features remain provisional pending
  subject-matter review and labelled pilot evaluation.
dimensions:
