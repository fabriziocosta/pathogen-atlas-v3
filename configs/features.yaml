            organism_groups:
            - bacteria
            review_status: inherited_v2_needs_review
            legacy_v2_question_id: anaerobic
            instructions: Use only the title and abstract. Answer yes only when the text explicitly supports this
              feature for the named organism and human disease context. Do not use outside knowledge. If unsupported
              or absent, answer no.
            criteria:
              'true': The title or abstract explicitly states or clearly supports the feature in the question definition.
              'false': The feature is absent, unsupported, relates to another organism/context, or requires inference.
            question: 'In this abstract, is the following claim explicitly reported about the named species in the
              human disease context: “the named bacterium is described as an anaerobic or facultatively anaerobic
              organism”?'
            inclusion_examples:
            - 'Example inclusion (schematic): The abstract explicitly reports: “the named bacterium is described
              as an anaerobic or facultatively anaerobic organism.”'
            exclusion_examples:
            - 'Example exclusion (schematic): The abstract mentions anaerobic only as background, or only for another
              organism or a non-human setting, without explicitly reporting it for the named species in human disease.'
