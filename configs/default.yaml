project:
  id: pathogen-atlas-v3
  schema_version: 1
  domains:
  - bacteria
  - fungi
  - viruses
run:
  organism_groups:
  - viruses
paths:
  data_root: data
  migration_source: data/migration/version2_snapshot
  taxonomy_release: data/01_taxonomy/release
  pubmed_cache: data/02_pubmed/cache
  pubmed_release: data/02_pubmed/release
  pubmed_domain_root: data/02_pubmed/domains
  decision_ledger: data/03_decisions/parsed/decision_ledger.parquet
  raw_responses: data/03_decisions/raw_responses/jev.jsonl
  release_root: data/04_release
  embedding_root: data/05_embeddings
taxonomy:
  bacteria:
    source: lpsn
    release: local-live-capture
  fungi:
    source: species_fungorum
    companion_nomenclature_sources:
    - index_fungorum
    - mycobank
    release: Species Fungorum snapshot archived 12 October 2026; export 16 October
      2026
  viruses:
    source: ictv_msl
    release: ICTV MSL41 (2025 taxonomy; ratified February 2026), v1
    variant_metadata_source: ictv_vmr
    variant_metadata_release: ICTV VMR MSL41 v1, 2026-07-29
pubmed:
  email_env: NCBI_EMAIL
  api_key_env: NCBI_API_KEY
  tool: pathogen_atlas_v3
  max_workers: 48
  request_delay_seconds: null
  batch_size: 200
  retmax: 10000
  # Standalone VMR abbreviations that collide with common human/biomedical
  # terms. Values remain in taxonomy provenance but are omitted from searches.
  exclude_ambiguous_aliases:
    - cnv
    - hrv
    - gamma
    - cd4
    - pm2
    - rsv
  sampling:
    max_pmids_per_species: 200
    oldest_pmids_per_species: 30
    random_seed: 42
  checkpoint_every: 100
  max_calls: null
  max_fetch_batches: null
decisions:
  provider: openrouter_jev
  model: typesafe/jev-1.14
  endpoint: https://openrouter.ai/api/alpha/decisions
  timeout_seconds: 90
  retries: 3
  backoff_seconds: 1.0
  max_workers: 32
  max_calls: null
  pathogen_question_version: human-disease-attribution-v3.1
  feature_question_set_version: multi-domain-features-v3.2
  pathogen_threshold: 0.75
  feature_yes_threshold: 0.75
  release_evaluation_approved: false
  cost_estimate:
    expected_pathogen_fraction: 0.5
    input_tokens_per_gate_call: 1200
    input_tokens_per_feature_call: 12000
    output_tokens_per_call: 500
    input_usd_per_million_tokens: 0.042
    output_usd_per_million_tokens: 0.0
embedding:
  cross_domain_feature_profile: shared-core-v1
  within_domain_feature_profile: domain-specific-v1
  zero_impute_not_applicable: false
  seed: 42
  n_msts: 15
  n_epochs: 300
  mst_method: famst
  mst_neighbors: 15
  mst_inter_component_edges: 5
  mst_max_neighbors: null
  negative_ratio: 5
  lambda_rep: 0.5
  learning_rate: 0.05
  batch_size: 32768
  epsilon: 0.0001
  logistic_margin: 1.0
  logistic_temperature: 0.5
  mst_representatives_per_component: 10
  device: auto
logging:
  progress_every: 100
  show_eta: true
  show_openrouter_balance: true
